<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AUCSE Sink - Admin Management Dashboard</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.8/purify.min.js"></script>
    <!-- Three.js dependency -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r121/three.min.js"></script>
<!-- Vanta.js Birds Effect -->
<script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.birds.min.js"></script>
  </head>
  <body class="data-matrix-bg">
    <div class="main-container">
      <nav class="top-navbar">
        <div class="logo" style="color: #d97706;">🛡️ Admin Control Panel</div>
        <div class="top-nav-links">
          <a href="index.html" class="top-nav-item">🏠 Home</a>
          <a href="admin-manage.html" class="top-nav-item active" style="color: #d97706; font-weight: 700;">⚙️ Manage Carousels</a>
        </div>
      </nav>

      <div class="dashboard-content" style="grid-template-columns: 1fr">
        <!-- Guard Notice -->
        <div id="admin-guard-card" class="card" style="display: none; text-align: center; padding: 40px">
          <h2 style="color: #ef4444">Access Denied</h2>
          <p>You must be signed in through the Admin Portal to view this management page.</p>
          <a href="index.html" class="btn-submit" style="display: inline-block; text-decoration: none; margin-top: 10px;">Return Home</a>
        </div>

        <!-- Management Forms Container -->
        <div id="admin-panels" style="display: flex; flex-direction: column; gap: 24px">
          
          <!-- 1. Manage Campus Events -->
          <div class="card">
            <h3>Manage Upcoming Campus Events</h3>
            <div class="form-group">
              <input type="text" id="event-badge" placeholder="Badge (e.g. Tech Fest, Workshop)" />
              <input type="text" id="event-title-input" placeholder="Event Title" />
              <textarea id="event-desc-input" placeholder="Event Description..."></textarea>
              
              <label style="font-size: 0.85rem; color: var(--text-muted); margin-top: 4px;">Auto-Delete After (Expiry Date):</label>
              <input type="date" id="event-expiry" required />

              <button class="btn-submit" onclick="addAdminEvent()">
                ➕ Add Event to Dashboard
              </button>
            </div>
          </div>

          <!-- 2. Manage Achievements -->
          <div class="card">
            <h3>Manage Student & Faculty Achievements</h3>
            <div class="form-group">
              <input type="text" id="ach-category" placeholder="Category (e.g. Award, Research, Sports)" />
              <input type="text" id="ach-title" placeholder="Achievement Title" />
              <textarea id="ach-desc" placeholder="Achievement Description..."></textarea>
              
              <label style="font-size: 0.85rem; color: var(--text-muted); margin-top: 4px;">Auto-Delete After (Expiry Date):</label>
              <input type="date" id="ach-expiry" required />

              <button class="btn-submit" onclick="addAdminAchievement()">
                ➕ Add Achievement to Dashboard
              </button>
            </div>
          </div>

          <!-- 3. Manage Placements -->
          <div class="card">
            <h3>Manage Placement & Hiring Updates</h3>
            <div class="form-group">
              <input type="text" id="place-company" placeholder="Company Name (e.g. Microsoft)" />
              <input type="text" id="place-role" placeholder="Role (e.g. Data Lead)" />
              <input type="text" id="place-package" placeholder="Package (e.g. 18 LPA)" />
              <input type="text" id="place-deadline" placeholder="Deadline Label (e.g. Next Month)" />
              
              <label style="font-size: 0.85rem; color: var(--text-muted); margin-top: 4px;">Auto-Delete After (Expiry Date):</label>
              <input type="date" id="place-expiry" required />

              <button class="btn-submit" onclick="addAdminPlacement()">
                ➕ Add Hiring Drive to Dashboard
              </button>
            </div>
          </div>

        </div>
      </div>
    </div>

    <div id="notification-toast"></div>
    <script src="script.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const session = JSON.parse(localStorage.getItem("portal_session") || "{}");
        const hasAdminAccess = session.isAdmin === true || ['representative', 'president', 'secretary', 'executive'].includes(session.role);
        
        if (!hasAdminAccess) {
          document.getElementById("admin-panels").style.display = "none";
          document.getElementById("admin-guard-card").style.display = "block";
        }
      });
    </script>
  </body>
</html>
